<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.title{font:700 34px Arial;fill:#0f172a}.box{fill:#fff;stroke:#334155;stroke-width:2}.code{fill:#e0f2fe;stroke:#0369a1}.check{fill:#dcfce7;stroke:#15803d}.secure{fill:#fef3c7;stroke:#b45309}.deploy{fill:#ede9fe;stroke:#6d28d9}.txt{font:600 20px Arial;fill:#0f172a}.small{font:17px Arial;fill:#334155}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}.label{font:600 17px Arial;fill:#475569}</style></defs>
  <rect width="1400" height="650" fill="#fff"/><text x="700" y="52" text-anchor="middle" class="title">Chuỗi kiểm soát DevSecOps từ commit đến GKE</text>
  <rect x="45" y="125" rx="16" width="190" height="110" class="box code"/><text x="140" y="169" text-anchor="middle" class="txt">Commit và PR</text><text x="140" y="201" text-anchor="middle" class="small">GitHub</text>
  <rect x="285" y="125" rx="16" width="220" height="110" class="box check"/><text x="395" y="164" text-anchor="middle" class="txt">Kiểm thử</text><text x="395" y="194" text-anchor="middle" class="small">Backend, ML, frontend</text>
  <rect x="555" y="100" rx="16" width="270" height="160" class="box secure"/><text x="690" y="139" text-anchor="middle" class="txt">Phân tích bảo mật</text><text x="690" y="174" text-anchor="middle" class="small">Gitleaks và Semgrep</text><text x="690" y="204" text-anchor="middle" class="small">pip-audit, npm audit</text><text x="690" y="234" text-anchor="middle" class="small">Trivy</text>
  <rect x="875" y="100" rx="16" width="220" height="160" class="box deploy"/><text x="985" y="139" text-anchor="middle" class="txt">Artefact</text><text x="985" y="174" text-anchor="middle" class="small">Image digest</text><text x="985" y="204" text-anchor="middle" class="small">SBOM</text><text x="985" y="234" text-anchor="middle" class="small">Cosign signature</text>
  <rect x="1145" y="125" rx="16" width="210" height="110" class="box deploy"/><text x="1250" y="169" text-anchor="middle" class="txt">Triển khai GKE</text><text x="1250" y="201" text-anchor="middle" class="small">Helm và Terraform</text>
  <path d="M235 180 H285" class="line"/><path d="M505 180 H555" class="line"/><path d="M825 180 H875" class="line"/><path d="M1095 180 H1145" class="line"/>

  <rect x="170" y="400" rx="16" width="260" height="120" class="box secure"/><text x="300" y="441" text-anchor="middle" class="txt">Biên mạng</text><text x="300" y="473" text-anchor="middle" class="small">Gateway và Cloud Armor</text>
  <rect x="570" y="400" rx="16" width="260" height="120" class="box secure"/><text x="700" y="441" text-anchor="middle" class="txt">Trong cluster</text><text x="700" y="473" text-anchor="middle" class="small">NetworkPolicy và securityContext</text>
  <rect x="970" y="400" rx="16" width="260" height="120" class="box secure"/><text x="1100" y="441" text-anchor="middle" class="txt">Trong ứng dụng</text><text x="1100" y="473" text-anchor="middle" class="small">JWT, ownership, Redis rate limit</text>
  <path d="M1250 235 C1230 330,400 315,300 400" class="line"/><path d="M1250 235 C1190 340,800 330,700 400" class="line"/><path d="M1250 235 C1230 330,1130 350,1100 400" class="line"/>
  <text x="700" y="570" text-anchor="middle" class="label">Một kiểm soát đơn lẻ không thay thế các lớp còn lại</text>
