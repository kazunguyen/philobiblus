name: CD Pipeline

on:
  push:
    branches:
      - main
    # Ideally trigger only on tags, but for this training we'll just mock it on push to main
    # after CI passes.

jobs:
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    # needs: [test-backend, test-ml, build-trainer, build-model-fetcher] # Skipping needs for demo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github/providers/my-repo'
          service_account: 'my-service-account@my-project.iam.gserviceaccount.com'

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Images
        run: |
          export DIGEST=$(git rev-parse --short HEAD)
          # Mock building and pushing...
          echo "Building backend, frontend, recommendation, trainer, model-fetcher..."
          # docker push ...

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        run: |
          cd infrastructure/terraform/gke-mlops
          terraform init
          terraform apply -auto-approve

      - name: Deploy Helm Charts
        run: |
          # Deploy MLOps components
          helm upgrade --install philobiblus-mlops kubernetes/helm/philobiblus-mlops -n philobiblus-mlops --create-namespace
          
          # Deploy Application (Decoupled from ML pipeline retraining)
          helm upgrade --install philobiblus kubernetes/helm/philobiblus -n philobiblus
