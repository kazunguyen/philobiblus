name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    name: Run Backend Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: |
          pytest -v

  test-ml:
    name: Run ML Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-training.txt
      - name: Run ML tests
        run: |
          pytest recommendation-service/tests -v

  build-trainer:
    name: Build Trainer Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Trainer
        run: docker build -t trainer:test -f ml/training/Dockerfile ml

  build-model-fetcher:
    name: Build Model Fetcher Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Fetcher
        run: docker build -t fetcher:test -f ml/model-fetcher/Dockerfile ml/model-fetcher