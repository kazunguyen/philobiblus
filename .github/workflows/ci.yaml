name: Backend CI Pipeline

# Trigger workflow on push or pull request to main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    name: Run Pytest
    runs-on: ubuntu-latest
    
    # Ensure all run commands execute within the backend directory
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Enable dependency caching for faster pipeline execution
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        # Set PYTHONPATH so pytest can discover the 'app' module properly
        env:
          PYTHONPATH: .
        run: |
          pytest -v