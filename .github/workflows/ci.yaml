name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: pytest -v
        env: { PYTHONPATH: . }

  ml-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "ml/requirements-training.txt" }
      - run: python -m pip install --upgrade pip && pip install pytest -r requirements-training.txt -r recommendation-service/requirements.txt
      - run: python -m compileall -q src model-fetcher recommendation-service/app
      - run: pytest -v recommendation-service/tests tests
        env: { PYTHONPATH: recommendation-service:src }
      - run: pip install "dvc>=3.0,<4.0" && dvc repro --dry train

  manifests-and-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Render Helm charts with non-secret fixtures
        run: |
          helm lint kubernetes/helm/philobiblus --set backend.service.port=8000 --set backend.bindHost=0.0.0.0 --set backend.allowedOrigins=https://example.com --set frontend.service.port=80 --set frontend.apiUrl=/api --set frontend.devHost=0.0.0.0 --set frontend.devPort=5173 --set postgres.service.port=5432 --set ingress.host=example.com --set recommendation.fetcherImage.repository=example.com/fetcher --set recommendation.fetcherImage.tag=test
          helm template philobiblus kubernetes/helm/philobiblus --set backend.service.port=8000 --set backend.bindHost=0.0.0.0 --set backend.allowedOrigins=https://example.com --set frontend.service.port=80 --set frontend.apiUrl=/api --set frontend.devHost=0.0.0.0 --set frontend.devPort=5173 --set postgres.service.port=5432 --set ingress.host=example.com --set recommendation.fetcherImage.repository=example.com/fetcher --set recommendation.fetcherImage.tag=test >/dev/null
          helm lint kubernetes/helm/philobiblus-mlops --set gcp.sqlConnectionName=project:region:instance --set trainer.artifactBucket=fixture-bucket --set mlflow.image.repository=example.com/mlflow --set mlflow.image.tag=test --set trainer.image.repository=example.com/trainer --set trainer.image.tag=test --set mlflow.serviceAccount.gcpServiceAccount=mlflow@example.iam.gserviceaccount.com --set trainer.serviceAccount.gcpServiceAccount=trainer@example.iam.gserviceaccount.com
          helm template philobiblus-mlops kubernetes/helm/philobiblus-mlops --set gcp.sqlConnectionName=project:region:instance --set trainer.artifactBucket=fixture-bucket --set mlflow.image.repository=example.com/mlflow --set mlflow.image.tag=test --set trainer.image.repository=example.com/trainer --set trainer.image.tag=test --set mlflow.serviceAccount.gcpServiceAccount=mlflow@example.iam.gserviceaccount.com --set trainer.serviceAccount.gcpServiceAccount=trainer@example.iam.gserviceaccount.com >/dev/null
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infrastructure/terraform/gke-mlops fmt -check -recursive
      - run: terraform -chdir=infrastructure/terraform/gke-mlops init -backend=false && terraform -chdir=infrastructure/terraform/gke-mlops validate

  build-ml-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t philobiblus-trainer:test -f ml/training/Dockerfile ml
      - run: docker build -t philobiblus-model-fetcher:test -f ml/model-fetcher/Dockerfile ml/model-fetcher
      - run: docker build -t philobiblus-mlflow:test -f ml/mlflow/Dockerfile ml/mlflow
