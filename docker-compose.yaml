services:
  # ---------------------------------------------
  # 1. PostgreSQL Database Service
  # ---------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: philobiblus-db
    restart: always
    command: ["postgres", "-p", "${POSTGRES_PORT:?POSTGRES_PORT is required}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT is required}
    ports:
      - "${POSTGRES_HOST_PORT:?POSTGRES_HOST_PORT is required}:${POSTGRES_PORT:?POSTGRES_PORT is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p $${POSTGRES_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - philobiblus-net

  # ---------------------------------------------
  # 2. FastAPI Backend Service
  # ---------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: philobiblus-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:?ACCESS_TOKEN_EXPIRE_MINUTES is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      APP_HOST: ${APP_HOST:?APP_HOST is required}
      APP_PORT: ${BACKEND_PORT:?BACKEND_PORT is required}
    ports:
      - "${BACKEND_HOST_PORT:?BACKEND_HOST_PORT is required}:${BACKEND_PORT:?BACKEND_PORT is required}"
    volumes:
      # Mount app directory for local development hot-reloading
      - ./backend/app:/app/app
    networks:
      - philobiblus-net

  # ---------------------------------------------
  # 3. Database Seed Service
  # ---------------------------------------------
  db-seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: philobiblus-db-seed
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:?ACCESS_TOKEN_EXPIRE_MINUTES is required}
    command: ["python", "-m", "scripts.seed_database"]
    restart: "no"
    networks:
      - philobiblus-net

  # ---------------------------------------------
  # 4. React Frontend Service
  # ---------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: philobiblus-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:?FRONTEND_HOST_PORT is required}:${FRONTEND_PORT:?FRONTEND_PORT is required}"
    environment:
      VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
      VITE_DEV_HOST: ${VITE_DEV_HOST:?VITE_DEV_HOST is required}
      VITE_DEV_PORT: ${FRONTEND_PORT:?FRONTEND_PORT is required}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - philobiblus-net

  # ---------------------------------------------
  # 5. Nginx Reverse Proxy
  # ---------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: philobiblus-nginx
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "${NGINX_HOST_PORT:?NGINX_HOST_PORT is required}:${NGINX_PORT:?NGINX_PORT is required}"
    environment:
      NGINX_PORT: ${NGINX_PORT:?NGINX_PORT is required}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?NGINX_SERVER_NAME is required}
      BACKEND_SERVICE_HOST: ${BACKEND_SERVICE_HOST:?BACKEND_SERVICE_HOST is required}
      BACKEND_SERVICE_PORT: ${BACKEND_PORT:?BACKEND_PORT is required}
      FRONTEND_SERVICE_HOST: ${FRONTEND_SERVICE_HOST:?FRONTEND_SERVICE_HOST is required}
      FRONTEND_SERVICE_PORT: ${FRONTEND_PORT:?FRONTEND_PORT is required}
    command:
      - /bin/sh
      - -c
      - >-
        envsubst '$$NGINX_PORT $$NGINX_SERVER_NAME $$BACKEND_SERVICE_HOST
        $$BACKEND_SERVICE_PORT $$FRONTEND_SERVICE_HOST $$FRONTEND_SERVICE_PORT'
        < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf &&
        exec nginx -g 'daemon off;'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    networks:
      - philobiblus-net

# ---------------------------------------------
# Volumes & Networks
# ---------------------------------------------
volumes:
  postgres_data:
    driver: local

networks:
  philobiblus-net:
    driver: bridge
