# Create a Secret from this file outside Git after replacing the webhook URL.
# The receiver is deliberately not enabled by default in the monitoring stack.
global:
  resolve_timeout: 5m
route:
  receiver: platform-notifications
  group_by: [alertname, namespace, component]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: platform-notifications
    slack_configs:
      - api_url: REPLACE_WITH_A_SECRET_WEBHOOK_URL
        channel: "#philobiblus-alerts"
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'
