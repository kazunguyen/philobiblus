# This chart deliberately ships without secrets.  Create the Secret named below
# before installing, or use a private values file with secrets.create=true.
nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

backend:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  image:
    repository: philobiblus-backend
    tag: local
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: ""
  bindHost: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  accessTokenExpireMinutes: 1440
  allowedOrigins: ""
  probe:
    initialDelaySeconds: 10
    periodSeconds: 5

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: philobiblus-frontend
    tag: local
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  apiUrl: ""
  grafanaUrl: ""
  devHost: ""
  devPort: ""
  probe:
    initialDelaySeconds: 10
    periodSeconds: 5

postgres:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  service:
    port: ""
  persistence:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

seed:
  enabled: true
  runOnUpgrade: true
  backoffLimit: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

secrets:
  # With the default setting, create this Secret out of band. It must include
  # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB and SECRET_KEY.
  existingSecret: philobiblus-secrets
  create: false
  postgresUser: ""
  postgresPassword: ""
  postgresDatabase: ""
  jwtSecret: ""
  imgbbApi: ""

ingress:
  enabled: true
  className: traefik
  host: ""
  annotations: {}

tests:
  enabled: true

recommendation:
  enabled: true
  replicaCount: 1
  image:
    repository: philobiblus-recommendation
    tag: tfidf-with-tags-v1
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  modelPath: /app/model/tfidf_recommender.joblib
  timeoutSeconds: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probe:
    initialDelaySeconds: 5
    periodSeconds: 10

serviceAccounts:
  backend:
    create: true
    name: ""
    annotations: {}
  recommendation:
    create: true
    name: ""
    annotations: {}
  seed:
    create: true
    name: ""
    annotations: {}

externalDatabase:
  enabled: false
  connectionName: ""
  proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.4
    privateIp: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

gcpSecrets:
  enabled: false
  includeImgbb: false
  projectId: ""
  databaseUrlSecret: ""
  jwtSecret: ""
  imgbbApiSecret: ""

gateway:
  enabled: false
  className: gke-l7-global-external-managed
  addressName: ""
  host: ""
  https:
    enabled: false
    certificateMapName: ""
  httpToHttpsRedirect: false

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: false
    prometheusRelease: monitoring
  podMonitoring:
    enabled: false
    interval: 30s
