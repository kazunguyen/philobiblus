{{- if .Values.monitoring.tracing.enabled }}
{{- $fullname := include "philobiblus.fullname" . }}
{{- $serviceAccountName := default (printf "%s-otel-collector" $fullname) .Values.monitoring.tracing.collector.serviceAccount.name }}
{{- if .Values.monitoring.tracing.collector.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccountName }}
  labels:
    {{- include "philobiblus.labels" . | nindent 4 }}
  {{- with .Values.monitoring.tracing.collector.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
      batch: {}
    exporters:
      {{- if eq .Values.monitoring.tracing.exporter "googlecloud" }}
      googlecloud: {}
      {{- else }}
      debug: {}
      {{- end }}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [{{ .Values.monitoring.tracing.exporter }}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-otel-collector
  labels:
    {{- include "philobiblus.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "philobiblus.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-otel-collector
  labels:
    {{- include "philobiblus.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "philobiblus.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      labels:
        {{- include "philobiblus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: otel-collector
    spec:
      serviceAccountName: {{ $serviceAccountName }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: collector
          image: {{ .Values.monitoring.tracing.collector.image | quote }}
          args: ["--config=/conf/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
          resources:
            {{- toYaml .Values.monitoring.tracing.collector.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-otel-collector
{{- end }}
