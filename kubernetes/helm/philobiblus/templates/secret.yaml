{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "philobiblus.secretName" . }}
  labels:
    {{- include "philobiblus.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ required "secrets.postgresUser is required when secrets.create=true" .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required when secrets.create=true" .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ required "secrets.postgresDatabase is required when secrets.create=true" .Values.secrets.postgresDatabase | quote }}
  SECRET_KEY: {{ required "secrets.jwtSecret is required when secrets.create=true" .Values.secrets.jwtSecret | quote }}
{{- end }}
