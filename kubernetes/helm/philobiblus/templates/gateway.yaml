{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "philobiblus.fullname" . }}
  labels:
    {{- include "philobiblus.labels" . | nindent 4 }}
  {{- if and .Values.gateway.https.enabled .Values.gateway.https.certificateMapName }}
  annotations:
    networking.gke.io/certmap: {{ .Values.gateway.https.certificateMapName | quote }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  addresses:
    - type: NamedAddress
      value: {{ required "gateway.addressName is required" .Values.gateway.addressName }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    {{- if .Values.gateway.https.enabled }}
    - name: https
      protocol: HTTPS
      port: 443
      {{- if .Values.gateway.host }}
      hostname: {{ .Values.gateway.host | quote }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- if and .Values.gateway.https.enabled .Values.gateway.httpToHttpsRedirect }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "philobiblus.fullname" . }}-http-redirect
  labels:
    {{- include "philobiblus.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "philobiblus.fullname" . }}
      sectionName: http
  {{- if .Values.gateway.host }}
  hostnames:
    - {{ .Values.gateway.host | quote }}
  {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "philobiblus.fullname" . }}-backend
  labels:
    {{- include "philobiblus.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "philobiblus.fullname" . }}
      {{- if .Values.gateway.https.enabled }}
      sectionName: https
      {{- end }}
  {{- if .Values.gateway.host }}
  hostnames:
    - {{ .Values.gateway.host | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "philobiblus.fullname" . }}-backend
          port: {{ required "backend.service.port is required" .Values.backend.service.port }}
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ include "philobiblus.fullname" . }}-backend
  labels:
    {{- include "philobiblus.labels" . | nindent 4 }}
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck:
        port: {{ required "backend.service.port is required" .Values.backend.service.port }}
        requestPath: /health
  targetRef:
    group: ""
    kind: Service
    name: {{ include "philobiblus.fullname" . }}-backend
{{- end }}
