{{- if .Values.gcpSecrets.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "philobiblus.fullname" . }}-gke-secrets
  labels:
    {{- include "philobiblus.labels" . | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ required "gcpSecrets.projectId is required" .Values.gcpSecrets.projectId }}/secrets/{{ required "gcpSecrets.databaseUrlSecret is required" .Values.gcpSecrets.databaseUrlSecret }}/versions/latest"
        path: "database-url"
      - resourceName: "projects/{{ .Values.gcpSecrets.projectId }}/secrets/{{ required "gcpSecrets.jwtSecret is required" .Values.gcpSecrets.jwtSecret }}/versions/latest"
        path: "jwt-secret"
      {{- if .Values.gcpSecrets.includeImgbb }}
      - resourceName: "projects/{{ .Values.gcpSecrets.projectId }}/secrets/{{ required "gcpSecrets.imgbbApiSecret is required" .Values.gcpSecrets.imgbbApiSecret }}/versions/latest"
        path: "imgbb-api"
      {{- end }}
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: {{ include "philobiblus.secretName" . }}
  labels:
    {{- include "philobiblus.labels" . | nindent 4 }}
spec:
  serviceAccountName: {{ include "philobiblus.backendServiceAccountName" . }}
  secretProviderClassName: {{ include "philobiblus.fullname" . }}-gke-secrets
  secretObject:
    type: Opaque
    data:
      - sourcePath: "database-url"
        targetKey: "DATABASE_URL"
      - sourcePath: "jwt-secret"
        targetKey: "SECRET_KEY"
      {{- if .Values.gcpSecrets.includeImgbb }}
      - sourcePath: "imgbb-api"
        targetKey: "IMGBB_API"
      {{- end }}
{{- end }}
