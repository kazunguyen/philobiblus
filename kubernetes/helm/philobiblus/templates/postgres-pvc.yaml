apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "philobiblus.fullname" . }}-postgres
  labels:
    {{- include "philobiblus.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.postgres.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
