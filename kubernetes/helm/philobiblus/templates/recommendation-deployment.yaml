{{- if .Values.recommendation.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "philobiblus.fullname" . }}-recommendation
  labels:
    {{- include "philobiblus.labels" . | nindent 4 }}
    app.kubernetes.io/component: recommendation
spec:
  replicas: {{ .Values.recommendation.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "philobiblus.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: recommendation
  template:
    metadata:
      annotations:
        mlops.philobiblus.io/model-version: "v1" # Patched by promote.py
      labels:
        {{- include "philobiblus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: recommendation
    spec:
      serviceAccountName: {{ include "philobiblus.recommendationServiceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: model-fetcher
          image: "{{ .Values.recommendation.fetcherImage.repository }}:{{ .Values.recommendation.fetcherImage.tag }}"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: model-release
          volumeMounts:
            - name: model-volume
              mountPath: /model
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: recommendation
          image: {{ include "philobiblus.recommendationImage" . | quote }}
          imagePullPolicy: {{ .Values.recommendation.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.recommendation.service.port }}
          env:
            - name: MODEL_PATH
              value: "/model/model.joblib"
          volumeMounts:
            - name: model-volume
              mountPath: /model
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.recommendation.probe.initialDelaySeconds }}
            periodSeconds: {{ .Values.recommendation.probe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ add .Values.recommendation.probe.initialDelaySeconds 10 }}
            periodSeconds: {{ .Values.recommendation.probe.periodSeconds }}
          resources:
            {{- toYaml .Values.recommendation.resources | nindent 12 }}
      volumes:
        - name: model-volume
          emptyDir: {}
{{- end }}
