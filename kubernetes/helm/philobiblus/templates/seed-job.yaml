{{- if .Values.seed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "philobiblus.fullname" . }}-seed
  labels:
    {{- include "philobiblus.labels" . | nindent 4 }}
    app.kubernetes.io/component: seed
  annotations:
    "helm.sh/hook": "post-install{{ if .Values.seed.runOnUpgrade }},post-upgrade{{ end }}"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.seed.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "philobiblus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: seed
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "philobiblus.seedServiceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.externalDatabase.enabled }}
        - name: cloud-sql-proxy
          image: {{ .Values.externalDatabase.proxy.image | quote }}
          restartPolicy: Always
          args:
            - "--structured-logs"
            {{- if .Values.externalDatabase.proxy.privateIp }}
            - "--private-ip"
            {{- end }}
            - "--unix-socket=/cloudsql"
            - {{ required "externalDatabase.connectionName is required" .Values.externalDatabase.connectionName | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cloudsql
              mountPath: /cloudsql
          resources:
            {{- toYaml .Values.externalDatabase.proxy.resources | nindent 12 }}
        {{- else }}
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          command: ["sh", "-c", "until pg_isready -h {{ include "philobiblus.fullname" . }}-postgres -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"; do sleep 2; done"]
          envFrom:
            - secretRef:
                name: {{ include "philobiblus.secretName" . }}
        {{- end }}
      containers:
        - name: seed
          image: {{ include "philobiblus.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python", "-m", "scripts.seed_database"]
          env:
            - name: PYTHONPATH
              value: /app
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "philobiblus.secretName" . }}
                  key: SECRET_KEY
            {{- if .Values.externalDatabase.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "philobiblus.secretName" . }}
                  key: DATABASE_URL
            {{- else }}
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "philobiblus.fullname" . }}-postgres:{{ required "postgres.service.port is required" .Values.postgres.service.port }}/$(POSTGRES_DB)"
            {{- end }}
          resources:
            {{- toYaml .Values.seed.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- if .Values.externalDatabase.enabled }}
          volumeMounts:
            - name: cloudsql
              mountPath: /cloudsql
          {{- end }}
      {{- if .Values.externalDatabase.enabled }}
      volumes:
        - name: cloudsql
          emptyDir: {}
      {{- end }}
{{- end }}
