apiVersion: monitoring.googleapis.com/v1
kind: GlobalRules
metadata:
  name: philobiblus-mlops-alerts
spec:
  groups:
    - name: mlops-alerts
      rules:
        - alert: RetrainingJobFailed
          expr: kube_job_failed{namespace="philobiblus-mlops", job_name=~"philobiblus-retrain.*"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Retraining Job Failed"
            description: "The MLOps retraining job has failed."
