{{- if .Values.secretSync.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: philobiblus-mlflow-db
  namespace: {{ .Values.namespace }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ required "gcp.projectId is required" .Values.gcp.projectId }}/secrets/{{ required "secretSync.mlflowDatabaseUrlSecret is required" .Values.secretSync.mlflowDatabaseUrlSecret }}/versions/latest"
        path: database_url
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: philobiblus-trainer-db
  namespace: {{ .Values.namespace }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ required "gcp.projectId is required" .Values.gcp.projectId }}/secrets/{{ required "secretSync.trainerDatabaseUrlSecret is required" .Values.secretSync.trainerDatabaseUrlSecret }}/versions/latest"
        path: database_url
{{- end }}
