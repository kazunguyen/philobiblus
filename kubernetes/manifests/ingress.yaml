apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: philobiblus-ingress
  namespace: philobiblus
spec:
  ingressClassName: traefik
  rules:
    - host: localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 5173